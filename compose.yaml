# Entorno de DESARROLLO de Deliberia. Un solo comando: docker compose up
# Todos los puertos se publican solo en 127.0.0.1 (no accesibles desde la red).
name: deliberia

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: deliberia-app:dev
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      DELIBERIA_BOOTSTRAP: "1"
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "127.0.0.1:${APP_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 300s

  worker:
    <<: *app
    command: php artisan queue:work --tries=3 --sleep=1 --max-time=3600
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  vite:
    <<: *app
    command: >
      bash -c "if [ -f package-lock.json ]; then npm ci; else npm install; fi
      && exec npm run dev"
    environment:
      VITE_HOST: "0.0.0.0"
      VITE_PORT: "${VITE_PORT:-5180}"
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:${VITE_PORT:-5180}:${VITE_PORT:-5180}"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:$VITE_PORT/@vite/client > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 90
      start_period: 120s
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-deliberia}
      POSTGRES_USER: ${DB_USERNAME:-deliberia}
      # Solo desarrollo: coincide con el valor local de .env.example.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-deliberia}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6390}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  vendor:
  node_modules:
