schema: spec-driven

# Contexto del proyecto: se muestra a la IA al crear artefactos.
context: |
  Producto: Deliberia, herramienta PERSONAL (un solo usuario) de práctica deliberada para
  entrevistas técnicas. La fuente de verdad del producto es ROADMAP.md (qué y por qué, no cómo).
  El repositorio es PÚBLICO y open source: nunca incluir secretos, correos reales ni rutas
  personales en archivos versionados; usar dominios reservados (example.com) en tests.

  Stack: Laravel 13 (PHP 8.4), Fortify (registro deshabilitado), Inertia 3 + React 19 +
  TypeScript, Tailwind 4, shadcn/ui, PostgreSQL 17, Redis 7, Docker Compose (make up).
  Calidad: Pint, Larastan nivel 8 (sin baseline), PHPUnit 12, Vite+ (`vp check`), `tsc`.
  Tests contra PostgreSQL real (deliberia_test). CI en GitHub Actions.
  Decisiones: docs/adr/. Flujo de trabajo: docs/WORKFLOW.md.

  Convenciones: GitHub Flow, ramas `<tipo>/<issue>-<slug>`, Conventional Commits, PR con squash.
  Una fase del ROADMAP = un change de OpenSpec = una issue epic; los grupos de tasks.md son sub-issues.
  Idioma: documentación y artefactos en español; código, commits y nombres de ramas en inglés.

  Requisitos no negociables (ver ROADMAP): YouTube solo embebido y API oficial; de plataformas
  externas solo URL y metadatos mínimos; el código del usuario nunca se ejecuta en el servidor de la
  app; toda URL externa se valida contra una lista de dominios (SSRF); autenticación y autorización
  en cada recurso; integraciones externas detrás de interfaces con fakes en tests; la IA es opcional
  y nunca se llama dentro de una petición HTTP; toda funcionalidad nueva lleva tests.

# Reglas por artefacto
rules:
  proposal:
    - Referenciar la fase del ROADMAP y listar explícitamente lo que queda fuera de alcance
  design:
    - Registrar las decisiones relevantes también como ADR en docs/adr/
  tasks:
    - Agrupar en bloques que quepan en una sub-issue y terminar cada grupo con su commit Conventional
    - Incluir tests y la actualización de la tabla de Estado del ROADMAP
